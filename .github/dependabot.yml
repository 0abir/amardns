version: 2
updates:
  # Check Cargo dependencies for updates and security patches
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # Keep GitHub Actions workflows up to date with stable releases
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Avoid phantom/unreleased action tags
      - dependency-name: "actions/checkout"
        versions: [">= 7.0.0"]
