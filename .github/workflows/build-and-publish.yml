name: Build, Publish Docker Image & Release Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Publish Scratch Image and Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine & Bump Release Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || git tag -l "v[0-9]*" --sort=-v:refname | head -n1 || echo "")
          echo "Latest GitHub Release: '$LATEST_RELEASE_TAG'"

          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "Cargo.toml declared version: '$CARGO_VERSION'"

          TARGET_VERSION="$CARGO_VERSION"

          # If the version in Cargo.toml has already been released on GitHub, auto-increment patch
          if [ -n "$CARGO_VERSION" ] && gh release view "v$CARGO_VERSION" >/dev/null 2>&1; then
            echo "Release v$CARGO_VERSION already exists on GitHub! Auto-incrementing patch version..."
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CARGO_VERSION"
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "Auto-computed next patch version: $TARGET_VERSION"

            sed -i "s/^version = \".*\"/version = \"$TARGET_VERSION\"/" Cargo.toml
            if [ -f Cargo.lock ]; then
              sed -i "0,/^name = \"amardns\"/{n;s/^version = \".*\"/version = \"$TARGET_VERSION\"/}" Cargo.lock
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to v${TARGET_VERSION} [skip ci]" || true
            git push origin main || true
          fi

          TARGET_TAG="v$TARGET_VERSION"
          echo "version=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Final target release tag: $TARGET_TAG"

      - name: Generate Release Notes & Changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.versioning.outputs.prev_tag }}"
          TARGET_TAG="${{ steps.versioning.outputs.version }}"

          echo "Generating changelog from '$PREV_TAG' to '$TARGET_TAG'..."

          CHANGES=""
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES=$(git log -n 10 --no-merges --pretty=format:"* %s (%h)")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="* Routine maintenance, security hardening, and performance optimizations."
          fi

          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "---"
            echo "**Release Tag**: \`$TARGET_TAG\`"
            echo "**Built for**: Linux x86_64 & AArch64/ARM64 (Musl static, zero-GC, Z+ security)"
            echo "**OTA Hot-Deploy Ready**: Compatible with in-place \`execve\` dashboard firmware updater."
          } > release_notes.md

          echo "--- Generated Release Notes ---"
          cat release_notes.md

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Quality Gate — Run full test suite
        run: cargo test --all-targets --all-features
        env:
          CARGO_TERM_COLOR: always

      - name: Quality Gate — Lint check (zero warnings policy)
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          CARGO_TERM_COLOR: always

      - name: Set up QEMU (multi-arch cross-compilation support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versioning.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract static binaries from multi-arch container
        run: |
          # 1. Extract and verify AMD64 static binary
          docker pull --platform linux/amd64 ghcr.io/${{ github.repository }}:latest
          CID_AMD=$(docker create --platform linux/amd64 ghcr.io/${{ github.repository }}:latest)
          docker cp "$CID_AMD":/amardns ./amardns
          docker rm -v "$CID_AMD"
          chmod +x ./amardns
          ./amardns --verify
          tar -czvf amardns-linux-amd64.tar.gz amardns
          sha256sum amardns > amardns.sha256
          sha256sum amardns-linux-amd64.tar.gz > amardns-linux-amd64.tar.gz.sha256

          # 2. Extract and verify ARM64 static binary (via QEMU)
          docker pull --platform linux/arm64 ghcr.io/${{ github.repository }}:latest
          CID_ARM=$(docker create --platform linux/arm64 ghcr.io/${{ github.repository }}:latest)
          docker cp "$CID_ARM":/amardns ./amardns-arm64
          docker rm -v "$CID_ARM"
          chmod +x ./amardns-arm64
          ./amardns-arm64 --verify
          tar -czvf amardns-linux-arm64.tar.gz amardns-arm64
          sha256sum amardns-arm64 > amardns-arm64.sha256
          sha256sum amardns-linux-arm64.tar.gz > amardns-linux-arm64.tar.gz.sha256

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          echo "Publishing GitHub Release: $VERSION"

          RELEASE_ASSETS=(
            ./amardns
            ./amardns-linux-amd64.tar.gz
            ./amardns.sha256
            ./amardns-linux-amd64.tar.gz.sha256
            ./amardns-arm64
            ./amardns-linux-arm64.tar.gz
            ./amardns-arm64.sha256
            ./amardns-linux-arm64.tar.gz.sha256
          )

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Uploading assets and updating notes..."
            gh release upload "$VERSION" "${RELEASE_ASSETS[@]}" --clobber
            gh release edit "$VERSION" --title "AmarDNS $VERSION" --notes-file release_notes.md --latest
          else
            echo "Creating release $VERSION..."
            gh release create "$VERSION" "${RELEASE_ASSETS[@]}" \
              --title "AmarDNS $VERSION" \
              --notes-file release_notes.md \
              --generate-notes \
              --latest
          fi

      - name: Prune old container package versions (keep latest only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="amardns"
          echo "Querying package versions for $PACKAGE_NAME..."
          VERSIONS=$(gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || gh api --paginate "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || echo "[]")
          echo "$VERSIONS" | jq -c '.[]' 2>/dev/null | while read -r item; do
            ID=$(echo "$item" | jq -r '.id')
            TAGS=$(echo "$item" | jq -r '.metadata.container.tags // [] | join(",")')
            echo "Found version ID $ID with tags: [$TAGS]"
            if [[ "$TAGS" != *"latest"* ]]; then
              echo "Pruning older package version $ID..."
              gh api --method DELETE "/user/packages/container/${PACKAGE_NAME}/versions/$ID" || true
            else
              echo "Preserving latest package version $ID."
            fi
          done || true
