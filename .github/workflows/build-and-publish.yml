name: Build, Publish Docker Image & Release Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  prepare:
    name: Determine Version & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      prev_tag: ${{ steps.versioning.outputs.prev_tag }}
      git_ref: ${{ steps.versioning.outputs.git_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine & Bump Release Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || git tag -l "v[0-9]*" --sort=-v:refname | head -n1 || echo "")
          echo "Latest GitHub Release: '$LATEST_RELEASE_TAG'"

          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "Cargo.toml declared version: '$CARGO_VERSION'"

          TARGET_VERSION="$CARGO_VERSION"

          # If the version in Cargo.toml has already been released on GitHub, auto-increment patch
          if [ -n "$CARGO_VERSION" ] && gh release view "v$CARGO_VERSION" >/dev/null 2>&1; then
            echo "Release v$CARGO_VERSION already exists on GitHub! Auto-incrementing patch version..."
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CARGO_VERSION"
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "Auto-computed next patch version: $TARGET_VERSION"

            sed -i "s/^version = \".*\"/version = \"$TARGET_VERSION\"/" Cargo.toml
            if [ -f Cargo.lock ]; then
              sed -i "0,/^name = \"amardns\"/{n;s/^version = \".*\"/version = \"$TARGET_VERSION\"/}" Cargo.lock
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to v${TARGET_VERSION} [skip ci]" || true
            git push origin main || true
          fi

          TARGET_TAG="v$TARGET_VERSION"
          echo "version=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "git_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Final target release tag: $TARGET_TAG"

      - name: Generate Release Notes & Changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.versioning.outputs.prev_tag }}"
          TARGET_TAG="${{ steps.versioning.outputs.version }}"

          echo "Generating changelog from '$PREV_TAG' to '$TARGET_TAG'..."

          CHANGES=""
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES=$(git log -n 10 --no-merges --pretty=format:"* %s (%h)")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="* Routine maintenance, security hardening, and performance optimizations."
          fi

          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "---"
            echo "**Release Tag**: \`$TARGET_TAG\`"
            echo "**Built for**: Linux x86_64 & AArch64/ARM64 (Native silicon, zero-emulation, zero-GC, Z+ security)"
            echo "**OTA Hot-Deploy Ready**: Compatible with in-place \`execve\` dashboard firmware updater."
          } > release_notes.md

          echo "--- Generated Release Notes ---"
          cat release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

  build-native:
    name: Build Native ${{ matrix.arch }} (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            bin_name: amardns
            archive_name: amardns-linux-amd64.tar.gz
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            bin_name: amardns-arm64
            archive_name: amardns-linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Native Quality Gate — Test suite (${{ matrix.arch }})
        run: cargo test --all-targets --all-features
        env:
          CARGO_TERM_COLOR: always

      - name: Native Quality Gate — Clippy check (${{ matrix.arch }})
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          CARGO_TERM_COLOR: always

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Extract & verify static binary natively
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}"
          docker pull "$IMAGE_TAG"
          CID=$(docker create "$IMAGE_TAG")
          mkdir -p artifacts
          docker cp "$CID":/amardns "./artifacts/${{ matrix.bin_name }}"
          docker rm -v "$CID"
          chmod +x "./artifacts/${{ matrix.bin_name }}"

          # Verify native execution on actual runner hardware (Zero emulation!)
          "./artifacts/${{ matrix.bin_name }}" --verify

          # Package and generate SHA-256 checksums
          cd artifacts
          tar -czvf "${{ matrix.archive_name }}" "${{ matrix.bin_name }}"
          sha256sum "${{ matrix.bin_name }}" > "${{ matrix.bin_name }}.sha256"
          sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          cd ..

      - name: Upload native artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.arch }}
          path: artifacts/*

  release:
    name: Multi-Arch Manifest & GitHub Release
    needs: [prepare, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.git_ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push multi-arch Docker manifest
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Merging native images into multi-arch manifest for $VERSION & latest..."
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:latest" \
            -t "ghcr.io/${{ github.repository }}:${VERSION}" \
            "ghcr.io/${{ github.repository }}:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}:${VERSION}-arm64"

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-amd64
          path: ./release-assets

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-arm64
          path: ./release-assets

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Publishing GitHub Release: $VERSION"

          ls -la ./release-assets

          RELEASE_ASSETS=(
            ./release-assets/amardns
            ./release-assets/amardns.sha256
            ./release-assets/amardns-linux-amd64.tar.gz
            ./release-assets/amardns-linux-amd64.tar.gz.sha256
            ./release-assets/amardns-arm64
            ./release-assets/amardns-arm64.sha256
            ./release-assets/amardns-linux-arm64.tar.gz
            ./release-assets/amardns-linux-arm64.tar.gz.sha256
          )

          if [ -f release_notes.md ]; then
            NOTES_ARGS=(--notes-file release_notes.md)
          elif [ -f ./release-assets/release_notes.md ]; then
            NOTES_ARGS=(--notes-file ./release-assets/release_notes.md)
          else
            NOTES_ARGS=(--notes "Production Release $VERSION")
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Uploading assets and updating notes..."
            gh release upload "$VERSION" "${RELEASE_ASSETS[@]}" --clobber
            gh release edit "$VERSION" --title "AmarDNS $VERSION" "${NOTES_ARGS[@]}" --latest
          else
            echo "Creating release $VERSION..."
            gh release create "$VERSION" "${RELEASE_ASSETS[@]}" \
              --target "${{ needs.prepare.outputs.git_ref }}" \
              --title "AmarDNS $VERSION" \
              "${NOTES_ARGS[@]}" \
              --latest
          fi

      - name: Prune old container package versions (keep latest only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="amardns"
          echo "Querying package versions for $PACKAGE_NAME..."
          VERSIONS=$(gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || gh api --paginate "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || echo "[]")
          echo "$VERSIONS" | jq -c '.[]' 2>/dev/null | while read -r item; do
            ID=$(echo "$item" | jq -r '.id')
            TAGS=$(echo "$item" | jq -r '.metadata.container.tags // [] | join(",")')
            echo "Found version ID $ID with tags: [$TAGS]"
            if [[ "$TAGS" != *"latest"* ]]; then
              echo "Pruning older package version $ID..."
              gh api --method DELETE "/user/packages/container/${PACKAGE_NAME}/versions/$ID" || true
            else
              echo "Preserving latest package version $ID."
            fi
          done || true
