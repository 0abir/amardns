app = "amardns"
primary_region = "sin"

[build]

[env]
  NODE_OPTIONS = "--max-old-space-size=192 --expose-gc"
  PORT = "8080"
  DOT_PORT = "8053"
  HOST = "::"
  CRON_SCHEDULE = "*/5 * * * *"
  DB_PATH = "/data/amardns.wal"
  LOG_LEVEL = "warn"
  USE_TLS = "false"
  DNS_MASTER_KEY = "abir"
  DNS_TOKEN_SECRET = "168598e7fdafa13fd7d222332cd7ca43650f44dbbf5a4d3a79ded96ed350ca2e"
  DNS_CACHE_SECRET = "745c28ae8c828285275ae3e139373f0977308ba99c072ae5cc47026ca076dde4"
  DNS_WORKER_NAME = "amardns"
  DNS_ACCESS_MODE = "public"
  EXPECTED_USERS = "AI"
  UPSTREAM_CRON = "0 0 * * *"
  UPSTREAM_TZ = "Asia/Dhaka"

[[mounts]]
  source = "amardns_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# HTTP & DoH (DNS-over-HTTPS)
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"
    method = "get"
    path = "/health"

# DoT (DNS-over-TLS for Android Private DNS)
[[services]]
  internal_port = 8053
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[services.ports]]
    port = 853
    handlers = ["tls"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"
