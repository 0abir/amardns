app = "amardns"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DOT_PORT = "8053"
  CRON_SCHEDULE = "*/5 * * * *"
  DB_PATH = "/data/amardns.wal"
  LOG_LEVEL = "warn"

[[mounts]]
  source = "amardns_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# HTTP & DoH (DNS-over-HTTPS)
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"
    method = "get"
    path = "/health"

# DoT (DNS-over-TLS for Android Private DNS)
[[services]]
  internal_port = 8053
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 853
    handlers = ["tls"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "10s"
